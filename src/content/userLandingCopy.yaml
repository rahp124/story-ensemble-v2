header:
  eyebrow: Welcome
  title: Tell us your story
  subtitle: Thank you for taking the time to help out with this study! We will ask you about your experiences, so that we can better design solutions for people like you.

informedContext:
  heading: About this study
  paragraphs:
    - You are being invited to participate in a research study conducted by Tony Li and Prof. Steven Dow from UC San Diego. The purpose of this research study is to explore new types of interactions with digital artifacts to express design feedback. Your participation in this research should last approximately 1 hour. If you agree to take part in this study, you will be asked to explore and comment on a digital prototype for the task of providing feedback for a designer on a new product concept in the prototype.
    - Your participation in this study is completely voluntary and you can withdraw at any time. Choosing not to participate or withdrawing will result in no penalty or loss of benefits to which you are entitled. You are free to skip any question that you choose.
    - If you have questions about this project or if you have a research-related problem, you may contact the researchers, Tony Li (toli@ucsd.edu) and Steven Dow (spdow@ucsd.edu). If you have any questions concerning your rights as a research subject, you may contact the UC San Diego Office of IRB Administration at irb@ucsd.edu or 858-246-4777.
    - The data you input during this study will be anonymized and used for research purposes only. However, information you input may be exposed to third-party AI models, so try to avoid inputting any identifiable or sensitive information.
    - By participating in this research you are indicating that you are at least 18 years old, have read this consent form, and agree to participate in this research study.


consent: I understand this is a research study and I agree to participate.

