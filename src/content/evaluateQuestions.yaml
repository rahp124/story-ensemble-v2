summaryPreviewQuestionId: per_item_open

itemFields:
  user:
    - gen_context_content
    - gen_context_reflect
    - gen_problem_content
    - gen_problem_reflect
    - gen_action_content
    - gen_action_reflect
    - gen_resolution_content
    - gen_resolution_reflect
  designer:
    - des_context
    - des_context_emo
    - des_problem
    - des_problem_emo
    - des_action
    - des_action_emo
    - des_resolution
    - des_resolution_emo

perItem:
  - id: specificity_likert
    type: likert
    prompt: "[Specificity] To what extent is this user's input detailed and specific?"
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: originality_likert
    type: likert
    prompt: "[Originality] To what extent is this user's input novel and surprising?"
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: actionability_likert
    type: likert
    prompt: "[Actionability] To what extent is this user's input actionable for informing a design process?"
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: per_item_open
    type: open_response
    prompt: Any notes/justifications for your evaluations?
    required: false
    placeholder: Optional

summary:
  - id: diversity_open
    type: open_response
    prompt: "[Diversity] How do the conditions' responses compare in terms of diversity of user stories?"
    required: false
    placeholder: 1-2 sentences.

  - id: comprehensibility_open
    type: open_response
    prompt: "[Comprehensibility] Which condition gave you a better understanding of the users and their experiences?"
    required: false
    placeholder: 1-2 sentences.

  - id: general_open
    type: open_response
    prompt: "[Overall] What differences do you notice between the user-led and designer-led storyboards in general?"
    required: false
    placeholder: 1-2 sentences.


