summaryPreviewQuestionId: per_item_open

itemFields:
  user:
    - gen_context_content
    - gen_context_reflect
    - gen_problem_content
    - gen_problem_reflect
    - gen_action_content
    - gen_action_reflect
    - gen_resolution_content
    - gen_resolution_reflect
  designer:
    - des_context
    - des_context_emo
    - des_problem
    - des_problem_emo
    - des_action
    - des_action_emo
    - des_resolution
    - des_resolution_emo

perItem:
  - id: per_item_open
    type: open_response
    prompt: "Do you notice any specific differences below with the user-led and designer-led data, especially in terms of the specificity of detail or emotional disclosure, from the perspective of understanding users? Write down your notes here."
    required: false
    placeholder: Optional

  - id: per_item_value_likert
    type: likert
    prompt: "Which condition's response is more valuable for informing a design process?"
    required: true
    points: 6
    minLabel: "{{leftCondition}} (left side) is much more valuable"
    maxLabel: "{{rightCondition}} (right side) is much more valuable"

summary:
  - id: diversity_open
    type: open_response
    prompt: "[Diversity] How do the conditions' responses compare in terms of diversity of user stories?"
    required: true
    placeholder: 1-2 sentences.

  - id: comprehensibility_open
    type: open_response
    prompt: "[Comprehensibility] Which condition gave you a better understanding of the users and their experiences?"
    required: true
    placeholder: 1-2 sentences.

  - id: general_open
    type: open_response
    prompt: "[Overall] Do you have any preference between user-led and designer-led responses in general?"
    required: true
    placeholder: 1-2 sentences.
