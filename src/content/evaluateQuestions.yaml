summaryPreviewQuestionId: per_item_open

itemFields:
  user:
    - gen_context_content
    - gen_context_reflect
    - gen_problem_content
    - gen_problem_reflect
    - gen_action_content
    - gen_action_reflect
    - gen_resolution_content
    - gen_resolution_reflect
  designer:
    - des_context
    - des_context_emo
    - des_problem
    - des_problem_emo
    - des_action
    - des_action_emo
    - des_resolution
    - des_resolution_emo

perItem:
  - id: per_item_open
    type: open_response
    prompt: "What differences do you notice between the user-led and designer-led responses? You may consider specificity, originality, and actionability of the responses from a design perspective."
    required: true
    placeholder: A couple sentences is sufficient.

  - id: per_item_value_likert
    type: likert
    prompt: "Which condition's response is more valuable for informing a design process?"
    required: true
    points: 6
    minLabel: "{{leftCondition}} much more valuable"
    maxLabel: "{{rightCondition}} much more valuable"

summary:
  - id: diversity_open
    type: open_response
    prompt: "[Diversity] How do the conditions' responses compare in terms of diversity of user stories?"
    required: false
    placeholder: 1-2 sentences.

  - id: comprehensibility_open
    type: open_response
    prompt: "[Comprehensibility] Which condition gave you a better understanding of the users and their experiences?"
    required: false
    placeholder: 1-2 sentences.

  - id: general_open
    type: open_response
    prompt: "[Overall] Do you have any preference between user-led and designer-led responses in general?"
    required: false
    placeholder: 1-2 sentences.
