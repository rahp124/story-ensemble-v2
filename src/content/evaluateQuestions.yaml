summaryPreviewQuestionId: per_item_open

itemFields:
  user:
    - gen_context_content
    - gen_context_reflect
    - gen_problem_content
    - gen_problem_reflect
    - gen_action_content
    - gen_action_reflect
    - gen_resolution_content
    - gen_resolution_reflect
  designer:
    - des_context
    - des_context_emo
    - des_problem
    - des_problem_emo
    - des_action
    - des_action_emo
    - des_resolution
    - des_resolution_emo

perItem:
  - id: per_item_value_likert
    type: likert
    prompt: "Which condition's response is more valuable for informing a design process of discovering user problems and needs?"
    required: true
    points: 6
    minLabel: "{{leftCondition}} (left side) is much more valuable"
    maxLabel: "{{rightCondition}} (right side) is much more valuable"

  - id: per_item_open
    type: open_response
    prompt: "Use this space to note any valuable user inputs or specific differences between the user-led and designer-led data. You can also highlight to copy text here."
    required: false
    placeholder: Optional

summary:
  - id: diversity_open
    type: open_response
    prompt: "[Diversity] How do the conditions' responses compare in terms of diversity of user stories?"
    required: false
    placeholder: 1-2 sentences.

  - id: comprehensibility_open
    type: open_response
    prompt: "[Comprehensibility] Which condition gave you a better understanding of the users and their experiences?"
    required: false
    placeholder: 1-2 sentences.

  - id: general_open
    type: open_response
    prompt: "[Overall] Do you have any preference between user-led and designer-led responses in general?"
    required: false
    placeholder: 1-2 sentences.
