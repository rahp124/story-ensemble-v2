eyebrow: Post-Survey
title: Reflect on your storyboard creation
subtitle: Your participation is not counted until you complete this survey.
downloadStoryboardButton: Download storyboard
submitButton: Submit survey
submitDisabledHint: Please answer all required questions.
completionTitle: Thank you for your participation!
completionMessage: Your responses have been recorded. You can close this window.

questions:
  - id: accuracy_likert
    type: likert
    prompt: To what extent do you feel your experience is told accurately through this storyboard process?
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: accuracy_open
    type: open_response
    prompt: What makes you say that about accuracy?
    required: true
    placeholder: Share aspects that were or were not accurately represented.

  - id: comprehensiveness_likert
    type: likert
    prompt: To what extent do you feel your experience is told comprehensively through this process?
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: comprehensiveness_open
    type: open_response
    prompt: What makes you say that about comprehensiveness?
    required: true
    placeholder: Share aspects that were or were not comprehensively represented.

  - id: nps
    type: likert
    prompt: How likely are you to recommend this tool to a friend or colleague?
    required: true
    points: 11
    minLabel: Not at all
    maxLabel: Completely

  - id: nps_open
    type: open_response
    prompt: What makes you say that about recommending this tool?
    required: true
    placeholder: Share why you would or wouldn't recommend this tool.
