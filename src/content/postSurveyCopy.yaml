eyebrow: Post-Survey
title: Reflect on your your feedback
subtitle: Your participation is not counted until you complete this survey.
downloadStoryboardButton: Download storyboard
submitButton: Submit survey
submitDisabledHint: Please answer all required questions.
completionTitle: Thank you for your participation!
completionMessage: Your responses have been recorded. You can close this window.

questions:
  - id: accuracy_likert
    type: likert
    prompt: To what extent did your feedback capture your experience?
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: accuracy_open
    type: open_response
    prompt: What makes you say that?
    required: true
    placeholder: 1-2 sentences.

  - id: comprehensiveness_likert
    type: likert
    prompt: To what extent did this task help you provide detailed reflection?
    required: true
    points: 7
    minLabel: Not at all
    maxLabel: Completely

  - id: comprehensiveness_open
    type: open_response
    prompt: What makes you say that about your reflection?
    required: true
    placeholder: 1-2 sentences.

