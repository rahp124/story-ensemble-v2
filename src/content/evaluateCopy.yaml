intro:
  eyebrow: Evaluation Study
  title: Storyboard Evaluation
  paragraphs:
    - In this task, we'd like you to imagine you're a user researcher helping the college Recreation Services with discovering students' issues and needs in order to improve their experiences. Recreation services include maintaining the fitness centers, recreation classes, and renting sports equipment.
    - You will review participant responses with storyboards around the topic of using the recreation services on campus. Each pair shows one designer-led response (a user reacted to a storyboard created by a designer) and one user-led response (a user created and reflected on their own storyboard) from the same participant, side by side.
    - You will evaluate each pair for relative design value, then you'll compare the two conditions holistically at the end. You are encouraged to think aloud and highlight/write down notes in the interface, which you will be able to see when you review the conditions later.
    # - Your progress is saved automatically. You can leave and return later using the same access ID.
  figures:
    - label: Designer-Led
      image: designer-led.jpg
      alt: Diagram of a designer presenting a storyboard to a user for feedback.
    - label: User-Led
      image: user-led.jpg
      alt: Diagram of a user telling their story to a designer, with story segments captured in boxes.
  beginButton: Begin evaluation

