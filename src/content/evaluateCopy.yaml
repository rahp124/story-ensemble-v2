  finishConfirmTitle: Finish evaluation?
  finishConfirmMessage: Move to the summary comparison? Only pairs you have fully completed will be included.
  finishConfirmButton: Continue to summary
  finishCancelButton: Cancel
  continueDisabledHint: Please answer all required questions before continuing.

summary:
  eyebrow: Review
  title: Compare storyboard conditions
  subtitle: >-
    User feedback was collected through two conditions: users creating their
    own storyboards and users reflecting on example storyboards. Review the
    user responses from both conditions and answer the final questions below.
  userColumnTitle: User-Led
  designerColumnTitle: Designer-Led
  downloadButton: Submit
  submitDisabledHint: Please answer all required questions before downloading.
  expandRowHint: Click a row to view full details
  previewNotesLabel: Your Notes
  emptyPairsHint: No completed pairs to compare yet.

