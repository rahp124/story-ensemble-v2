intro:
  eyebrow: Evaluation Study
  title: Storyboard Evaluation
  paragraphs:
    - You will review a series of storyboards and participant responses. Each item shows one storyboard image and the text responses associated with it.
    - You will answer a short set of questions for each item, then compare all items side-by-side at the end.
    - Your progress is saved automatically. You can leave and return later using the same access ID.
  beginButton: Begin evaluation

item:
  eyebrow: Evaluation
  continueButton: Continue
  backButton: Back
  continueDisabledHint: Please answer all required questions before continuing.
  progressLabel: Item {{current}} of {{total}}

summary:
  eyebrow: Summary
  title: Compare all storyboards
  subtitle: Review the user-led and designer-led storyboards side by side, then answer the final questions below.
  userColumnTitle: User-led
  designerColumnTitle: Designer-led
  downloadButton: Download responses
  submitDisabledHint: Please answer all required questions before downloading.
  expandRowHint: Click a row to view full details
  previewNotesLabel: "Your notes:"
