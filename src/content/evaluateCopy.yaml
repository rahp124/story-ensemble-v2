intro:
  eyebrow: Evaluation Study
  title: Storyboard Evaluation
  paragraphs:
    - You will review participant responses with storyboards around the topic of using the recreation services on campus. Each pair shows one user-led (user generates their own storyboard) and one designer-led (user reflects on a selected storyboard) response from the same participant, side by side.
    - You will answer a short set of questions for each pair, then compare your completed pairs holistically at the end.
    - Your progress is saved automatically. You can leave and return later using the same access ID.
  beginButton: Begin evaluation

