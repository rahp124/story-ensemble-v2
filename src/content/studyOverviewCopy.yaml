adminSetup: Admin Setup

header:
  eyebrow: Overview
  title: Here's what you'll do

features:
  - icon: "👥"
    title: Content
    description: Starting from some default storyboards, you will answer questions detailing your personal experience.
  - icon: "🎨"
    title: Aesthetics
    description: You will get the chance to reflect on your experiences and edit each generated scene to visually match your own experiences.
  - icon: "🎞️"
    title: Storyboard
    description: See your storyboard and adjust the narrative to tell your story in your own words.

topic:
  label: Topic
  defaultTopic: using the recreation gym on campus

priorExperience:
  legend: "Have you had a previous experience with {{topic}}?"
  helper: Either is fine — your answer just helps frame what comes next.
  options:
    - value: yes
      title: Yes, I've experienced this
      description: I will recall firsthand context with this topic.
    - value: no
      title: No, but I'll picture myself in this context
      description: I'll imagine the most realistic scenario for me.

experienceSummary:
  label: Briefly describe your experience
  optional: (optional)
  placeholder: 1-2 sentences about your experience
  helper:

continueButton: Continue
continueDisabledHint: Pick an answer to continue.
