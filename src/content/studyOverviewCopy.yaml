adminSetup: Admin Setup

header:
  eyebrow: Overview
  title: Here's what you'll do

topic:
  label: Topic
  defaultTopic: using the recreation gym on campus

intro:
  pre_paragraphs:
    - "In this study, you will answer a series of questions about a recent experience related to {{topic}}. Your responses will be used to create a visual storyboard that helps designers understand your experience and identify opportunities to improve it."
    - "The study takes approximately 30-45 minutes, followed by a 5-minute survey."
    - "A design storyboard is a sequence of images that illustrates an experience. It is typically organized into four panels:"

  steps:
    - "Context: what happened before the experience"
    - "Problem: the challenge or issue you encountered"
    - "Solution/Action: how the situation was addressed"
    - "Resolution: the outcome"

  post_paragraphs:
    - "Before you begin, take a moment to recall the most recent time you experienced an issue related to {{topic}}. Try to remember the events in as much detail as possible. If you have not experienced this yourself, imagine a realistic situation in which you encounter this type of issue."

priorExperience:
  legend: "Have you had a previous experience with {{topic}}?"
  helper: Either is fine — your answer just helps frame what comes next.
  options:
    - value: yes
      title: Yes, I can recall a particular experience
    - value: no
      title: No, but I can imagine a realistic scenario

continueButton: Continue
continueDisabledHint: Pick an answer to continue.
