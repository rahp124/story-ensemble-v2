adminSetup: Admin Setup

header:
  eyebrow: Overview
  title: Here's what you'll do

topic:
  label: Topic
  defaultTopic: using campus recreation resources
  descriptor: working out in the campus gyms, taking rec classes, renting equipment, etc.

intro:
  pre_paragraphs:
    - "Imagine your school is asking students like you to share their experiences with {{topic}}. They want to understand the issues that students face so they can work with designers to improve the student experience."
    # - "In this study, you will answer some questions about your experience with {{topic}}. Your responses will be used to create a visual storyboard that helps designers understand your experience and identify opportunities to improve."
    # - "The study takes approximately 30-45 minutes, followed by a 5-minute survey. You must create a storyboard and answer the survey at the end to receive full participation credit."
    - "In this study, you will answer some questions about your experience with {{topic}}. These questions will involve a visual UX storyboard. A UX storyboard is a sequence of images with text captions that illustrates a user experience. It is a tool that helps designers understand your experience and identify opportunities to improve. Below is an example storyboard with a different scenario. It is typically organized into four panels:"

  steps:
    - "Context: the setup for the experience"
    - "Problem: the challenge or issue"
    - "Action/Solution: how the situation was addressed"
    - "Outcome/Resolution: what happened as a result"

  post_paragraphs:
    user:
      - "Before you begin, take a moment to recall the most recent time you experienced an issue related to {{topic}}. Try to remember the events in as much detail as possible. If you have not experienced this yourself, imagine a realistic situation in which you encounter this topic."
    designer:
      - "Before you begin, take a moment to recall your experience with {{topic}}. Next, you will pick the storyboard that you relate to most and answer questions about each of its four panels."

priorExperience:
  legend: "Have you had a previous experience with {{topic}} ({{descriptor}})? "
  helper: Either is fine — your answer just helps frame what comes next.
  options:
    - value: yes
      title: Yes, I can recall a particular experience
    - value: no
      title: No, but I can imagine a realistic scenario

continueButton: Continue
continueDisabledHint: Pick an answer to continue.
